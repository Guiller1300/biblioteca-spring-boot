
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title th:replace="${titulo}">Biblioteca</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --text: #1e293b;
            --muted: #64748b;
            --background: #f3f6fb;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA DE NAVEGACIÓN */

        .navbar-custom {
            background: var(--dark);
            padding: 15px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,.12);
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: .3px;
        }

        .brand-icon {
            color: #60a5fa;
            margin-right: 8px;
        }

        .navbar-nav {
            gap: 8px;
        }

        .navbar-nav .nav-link {
            color: #cbd5e1;
            font-weight: 500;
            border-radius: 9px;
            padding: 10px 15px;
            transition: all .2s ease;
        }

        .navbar-nav .nav-link:hover {
            background: #1e293b;
            color: white;
        }

        .navbar-nav .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .navbar-nav .nav-link i {
            margin-right: 6px;
        }

        /* CONTENIDO */

        .main-content {
            flex: 1;
            width: 100%;
        }

        /* PIE DE PÁGINA */

        .footer-custom {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 20px 15px;
            margin-top: 35px;
        }

        .footer-custom p {
            margin: 0;
            font-size: .9rem;
            color: var(--muted);
        }

        .footer-custom .footer-brand {
            font-weight: 600;
            color: var(--text);
        }

        @media (max-width: 991px) {
            .navbar-nav {
                padding-top: 15px;
            }

            .navbar-nav .nav-link {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">

        <!-- LOGO -->
        <a class="navbar-brand d-flex align-items-center"
           th:href="@{/}">
            <i class="bi bi-book-half brand-icon"></i>
            Biblioteca
        </a>

        <!-- BOTÓN PARA CELULARES -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuBiblioteca"
                aria-controls="menuBiblioteca"
                aria-expanded="false"
                aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENÚ -->
        <div class="collapse navbar-collapse"
             id="menuBiblioteca">

            <div class="navbar-nav ms-auto">

                <a class="nav-link"
                   th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/'} ? 'active' : ''"
                   th:href="@{/}">
                    <i class="bi bi-house-door"></i>
                    Inicio
                </a>

                <a class="nav-link"
                   th:href="@{/libros}">
                    <i class="bi bi-book"></i>
                    Libros
                </a>

                <a class="nav-link"
                   th:href="@{/usuarios}">
                    <i class="bi bi-people"></i>
                    Usuarios
                </a>

                <a class="nav-link"
                   th:href="@{/prestamos}">
                    <i class="bi bi-journal-check"></i>
                    Préstamos
                </a>

            </div>
        </div>

    </div>
</nav>

<!-- CONTENIDO DINÁMICO -->
<div class="main-content">
    <main th:replace="${contenido}"></main>
</div>

<!-- FOOTER -->
<footer class="footer-custom text-center">
    <div class="container">
        <p class="footer-brand">
            <i class="bi bi-book-half me-1"></i>
            Sistema de Gestión Bibliotecaria
        </p>
        <p class="mt-1">
            Desarrollado con Spring Boot, Thymeleaf y SQLite
        </p>
    </div>
</footer>

<!-- JAVASCRIPT BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

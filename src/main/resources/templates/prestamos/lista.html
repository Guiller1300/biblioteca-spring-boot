<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Préstamos — Biblioteca</title></head>
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Préstamos</h2>
        <a class="btn btn-primary" th:href="@{/prestamos/nuevo}">Nuevo préstamo</a>
    </div>
    <p th:if="${#lists.isEmpty(prestamos)}" class="text-muted">No hay préstamos registrados.</p>
    <table class="table table-striped bg-white" th:unless="${#lists.isEmpty(prestamos)}">
        <thead>
        <tr><th>ID</th><th>Libro</th><th>Usuario</th><th>Fecha préstamo</th><th>Fecha devolución</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="prestamo : ${prestamos}">
            <td th:text="${prestamo.id}"></td>
            <td th:text="${prestamo.libro.titulo}"></td>
            <td th:text="${prestamo.usuario.nombre}"></td>
            <td th:text="${prestamo.fechaPrestamo}"></td>
            <td>
                <span th:if="${prestamo.fechaDevolucion == null}" class="badge bg-warning text-dark">Activo</span>
                <span th:unless="${prestamo.fechaDevolucion == null}" th:text="${prestamo.fechaDevolucion}"></span>
            </td>
            <td>
                <a th:if="${prestamo.fechaDevolucion == null}" class="btn btn-sm btn-success"
                   th:href="@{/prestamos/devolver/{id}(id=${prestamo.id})}">Devolver</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>

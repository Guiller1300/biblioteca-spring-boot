<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Inicio — Biblioteca</title></head>
<body>
<main class="container py-4">
    <h1 class="mb-4">Sistema de Biblioteca</h1>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card text-center p-3">
                <h2 th:text="${totalLibros}">0</h2>
                <p class="text-muted">Libros registrados</p>
                <a class="btn btn-primary" th:href="@{/libros}">Ver libros</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-3">
                <h2 th:text="${totalUsuarios}">0</h2>
                <p class="text-muted">Usuarios registrados</p>
                <a class="btn btn-primary" th:href="@{/usuarios}">Ver usuarios</a>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center p-3">
                <h2 th:text="${prestamosActivos}">0</h2>
                <p class="text-muted">Préstamos activos</p>
                <a class="btn btn-primary" th:href="@{/prestamos}">Ver préstamos</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>

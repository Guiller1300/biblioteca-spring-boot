<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Usuarios — Biblioteca</title></head>
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Usuarios</h2>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>
    <p th:if="${#lists.isEmpty(usuarios)}" class="text-muted">No hay usuarios registrados.</p>
    <table class="table table-striped bg-white" th:unless="${#lists.isEmpty(usuarios)}">
        <thead>
        <tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="usuario : ${usuarios}">
            <td th:text="${usuario.id}"></td>
            <td th:text="${usuario.nombre}"></td>
            <td th:text="${usuario.correo}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                   onclick="return confirm('¿Eliminar este usuario?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>

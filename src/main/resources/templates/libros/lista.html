<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::main})}">
<head><title>Libros — Biblioteca</title></head>
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Libros</h2>
        <a class="btn btn-primary" th:href="@{/libros/nuevo}">Nuevo libro</a>
    </div>
    <p th:if="${#lists.isEmpty(libros)}" class="text-muted">No hay libros registrados.</p>
    <table class="table table-striped bg-white" th:unless="${#lists.isEmpty(libros)}">
        <thead>
        <tr><th>ID</th><th>Título</th><th>Autor</th><th>Categoría</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody>
        <tr th:each="libro : ${libros}">
            <td th:text="${libro.id}"></td>
            <td th:text="${libro.titulo}"></td>
            <td th:text="${libro.autor}"></td>
            <td th:text="${libro.categoria}"></td>
            <td>
                <span th:if="${libro.prestado}" class="badge bg-warning text-dark">Prestado</span>
                <span th:unless="${libro.prestado}" class="badge bg-success">Disponible</span>
            </td>
            <td>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/libros/editar/{id}(id=${libro.id})}">Editar</a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{/libros/eliminar/{id}(id=${libro.id})}"
                   onclick="return confirm('¿Eliminar este libro?')">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
